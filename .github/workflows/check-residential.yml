name: Check Residential Quality

on:
  workflow_dispatch:  # 仅支持手动触发，不影响原 update.yml

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install openpyxl

      - name: Run Residential Node Quality Check
        run: |
          python scripts/check_residential.py

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/residential-check.csv output/residential-check.md
          if git diff --staged --quiet; then
            echo "报告内容与上次相同，无需提交。"
          else
            git commit -m "Node Quality Check: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
